<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biotone has moved</title><meta name="robots" content="noindex">
<script>
(function(){var p=location.pathname.replace(/^\/freqium(\/|$)/,'/biotone/');if(!/^\/biotone\//.test(p))p='/biotone/';
var to=p+location.search+location.hash;
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf('/freqium/')>-1)r.unregister();});}).catch(function(){});}
if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf('freqium-web-')===0)caches.delete(k);});});}
setTimeout(function(){location.replace(to);},150);})();
</script>
<meta http-equiv="refresh" content="1;url=/biotone/">
<style>body{background:#000;color:#ffc71f;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}a{color:#ffc71f}</style>
</head><body><p>Biotone has moved to <a href="/biotone/">alexgestalt.github.io/biotone</a>.</p></body></html>
