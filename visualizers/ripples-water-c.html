<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ripples Water C · Shimmer · Biotone</title><style>
html,body{margin:0;height:100%;background:#000;color:#f3d48a;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:min(145vw,95vh);height:min(145vw,95vh);display:block}
#ui{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000c 40%);display:grid;gap:4px}
.row{display:flex;align-items:center;gap:12px}
button{background:#1a1206;color:#ffcf6b;border:1px solid #b8862b;border-radius:30px;width:44px;height:44px;font-size:18px;flex:none}
input[type=range]{flex:1;accent-color:#e9a426;height:30px}
label{font-size:13px;min-width:62px;opacity:.85}#hz{font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
#top{position:fixed;top:0;left:0;right:0;padding:12px 16px;font-size:13px;opacity:.75}#top a{color:#ffcf6b}
</style></head><body><canvas id="c"></canvas>
<div id="top"><a href="./">‹ Gallery</a> · Ripples Water C · Shimmer: Fine, shimmering high-frequency ripples in radial symmetry.</div>
<div id="ui"><div class="row"><button id="play" aria-label="Play">▶</button>
<label>Frequency</label><input id="f" type="range" min="0" max="1" step="0.001" value="0.55"><span id="hz"></span></div>
<div class="row"><label>Level</label><input id="v" type="range" min="0" max="1" step="0.01" value="0.6"></div></div>
<script>
const MODE='gl',c=document.getElementById('c');
const fS=document.getElementById('f'),vS=document.getElementById('v'),hzE=document.getElementById('hz'),pb=document.getElementById('play');
const hzOf=x=>20*Math.pow(50,x);let ac,osc,gain,an,buf,on=false,L=0,F=+fS.value;
function upd(){hzE.textContent=hzOf(+fS.value).toFixed(1)+' Hz';if(osc){osc.frequency.setTargetAtTime(hzOf(+fS.value),ac.currentTime,.05);gain.gain.setTargetAtTime(on?(+vS.value)*.35:0,ac.currentTime,.08);}}
fS.oninput=vS.oninput=upd;let rt0=-99,ra=0;const kick=()=>{rt0=performance.now();ra=1;};fS.addEventListener('input',kick);vS.addEventListener('input',kick);pb.addEventListener('click',kick);
if(/ripple/.test(location.search))setTimeout(()=>{fS.value=.72;fS.dispatchEvent(new Event('input'));},3600);upd();
pb.onclick=()=>{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sine';gain=ac.createGain();gain.gain.value=0;an=ac.createAnalyser();an.fftSize=1024;buf=new Float32Array(1024);osc.connect(gain);gain.connect(an);an.connect(ac.destination);osc.start();}
ac.resume();on=!on;pb.textContent=on?'❚❚':'▶';upd();};
function level(){if(!an)return 0;an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.min(1,Math.sqrt(s/buf.length)*5);}
let W,H,dpr;function rs(){W=H=c.width=c.height=1024;}addEventListener('resize',rs);rs();
const t0=performance.now();
function tick(){const l=level();L+=(Math.max(l,.12)-L)*.04;F+=(+fS.value-F)*.03;}
if(MODE=='gl'){const g=c.getContext('webgl');
const sh=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS))throw new Error(g.getShaderInfoLog(o));return o};
const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}'));
g.attachShader(pr,sh(g.FRAGMENT_SHADER,`precision highp float;uniform vec2 uRes;uniform float uTime,uF,uL;
#define UND .4
#define RS .4
#define RF 70.
#define RW 60.
#define RD .6
#define GW 1.
#define GD 14.
#define GS 0.
#define SPEC 80.
#define SPECA 1.
#define CAU 0.
#define BASE mix(vec3(.4,.26,.07),vec3(.45,.2,.25),uF)

float h(float n){return fract(sin(n)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n2(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
vec3 fire(float t){t=max(t,0.);return vec3(1.,.72,.25)*t+vec3(.2,.12,0.)*t*t;}
const float R=.62;
vec3 eff0(vec2 p,float t){float r=length(p)/R;float cnt=3.+uF*20.;float rate=.3+uF*2.5;
float ph=r*cnt-t*rate+.6*sin(t*rate*.5);float rip=pow(.5+.5*cos(ph*6.2832),12.);
float band=.5+.5*cos(ph*6.2832+3.1416);vec3 spec=.5+.5*cos(6.2832*(r*1.5+vec3(0.,.15,.3))+t*.1);
return vec3(1.,.78,.3)*rip*(.7+uL)+spec*band*.07*vec3(1.,.8,.5);}
uniform float uRT,uRA;
float Hh(vec2 p,float t){float r=length(p),a=atan(p.y,p.x);float m=floor(6.+uF*12.);float k=40.+uF*110.;
 float h=.35*sin(r*k-t*(2.+uF*4.))*(.6+.4*cos(a*m+t*.2))+.25*sin((R-r)*k*1.3+t*3.)*cos(a*m*.5-t*.15);
 h*=(.5+.8*uL)*(.75+.25*sin(t*6.2832/5.5));h+=.15*n2(p*6.+t*.5);
 float age=uRT;float dr=r-age*RS;h+=uRA*1.1*sin(dr*RF)*exp(-dr*dr*RW)*exp(-age*RD)*(.7+.3*cos(a*m));return h;}
vec3 water(vec2 p,float t){float r=length(p);float m=smoothstep(R*.97,R*.35,r);if(m<=0.)return vec3(0.);
 float e=.002;float h=Hh(p,t);vec2 g=vec2(Hh(p+vec2(e,0),t)-h,Hh(p+vec2(0,e),t)-h)/e;
 vec3 nrm=normalize(vec3(-g*.05,1.));float dif=max(dot(nrm,normalize(vec3(-.5,.6,.8))),0.);float spec=pow(max(dot(reflect(-normalize(vec3(.4,-.5,.9)),nrm),vec3(0,0,1)),0.),SPEC);
 vec2 q=p+g*.002*GW+vec2(0.,t*.01);float mat=fbm(q*4.+h*.3);
 float sp2=pow(max(dot(reflect(-normalize(vec3(-.3,.4,.9)),nrm),vec3(0,0,1)),0.),SPEC*.4);vec3 c=vec3(0.)+vec3(1.,.9,.68)*spec*SPECA*3.;
 vec2 gl=abs(fract(q*GD)-.5);float grid=smoothstep(.04,.0,min(gl.x,gl.y));c+=vec3(1.,.75,.3)*grid*GS*(.5+.5*dif);
 float cau=pow(clamp(1.-length(g)*.25,0.,1.),1.)*0.;cau=pow(abs(sin(q.x*30.+h*2.)*sin(q.y*30.-h*2.)),6.);c+=vec3(1.,.85,.4)*cau*CAU*(.6+grid*2.);
 return c*m;}
vec3 eff(vec2 p,float t){vec2 p0=p;
#ifdef BEND
 vec2 pp=p;float rr=length(p);float dr=rr-uRT*RS;p+=normalize(p+1e-5)*uRA*.05*sin(dr*RF)*exp(-dr*dr*RW*.3)*exp(-uRT*RD);
#endif
 return water(p0,t)*1.6;}
vec3 icon(vec2 p,float t,vec3 col){float r=length(p);float d=r-R;
 vec3 c=col*smoothstep(R,R-.02,r)+col*smoothstep(R+.01,R+.03,r)*.6; // effect, a bit dimmer outside
 c+=vec3(1.,.62,.12)*.35*exp(-max(-d,0.)*70.)*step(r,R); // inward glow
 float th=.055,sh=clamp(1.-abs(d)/th,0.,1.);float lit=.55+.45*dot(normalize(p+1e-5),normalize(vec2(-.6,.8)));
 vec3 gold=mix(vec3(.55,.32,.04),vec3(1.,.86,.38),pow(sh,.7)*lit)+vec3(1.,.97,.8)*pow(sh,8.)*.6;
 c=mix(c,gold,smoothstep(0.,.08,sh));c+=vec3(1.,.6,.1)*.18*exp(-abs(d)*14.); // bloom
 return c;}
void main(){vec2 p=(gl_FragCoord.xy/uRes)*2.-1.;float t=uTime;gl_FragColor=vec4(icon(p,t,eff(p,t)),1.);}
`));g.linkProgram(pr);g.useProgram(pr);
g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);g.enableVertexAttribArray(0);g.vertexAttribPointer(0,2,g.FLOAT,false,0,0);
const U=n=>g.getUniformLocation(pr,n),uR=U('uRes'),uT=U('uTime'),uFl=U('uF'),uLl=U('uL');
(function f(){tick();g.viewport(0,0,W,H);g.uniform2f(uR,W,H);g.uniform1f(uT,(performance.now()-t0)/1000);g.uniform1f(uFl,F);g.uniform1f(uLl,L);g.uniform1f(U("uRT"),(performance.now()-rt0)/1000);g.uniform1f(U("uRA"),ra);g.drawArrays(g.TRIANGLES,0,3);requestAnimationFrame(f);})();
}</script></body></html>
